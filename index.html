
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Servidor Web Nginx | Actividad</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0f172a;
      color: white;
      font-family: Arial, sans-serif;
    }

    .card {
      max-width: 600px;
      margin: 20px;
      padding: 45px;
      background: #1e293b;
      border-radius: 18px;
      text-align: center;
      box-shadow: 0 15px 40px #0005;
    }

    h1 { color: #38bdf8; }

    p {
      color: #cbd5e1;
      line-height: 1.7;
    }

    .status {
      display: inline-block;
      margin-top: 15px;
      padding: 12px 20px;
      background: #064e3b;
      color: #6ee7b7;
      border-radius: 25px;
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>¡Servidor Nginx funcionando!</h1>

    <h2>
      Hola Chic@s, mi servidor Nginx
      está funcionando
    </h2>

    <p>
      Actividad académica de configuración
      y puesta en marcha de un servidor web
      utilizando software libre.
    </p>

    <div class="status">
      Servidor activo | HTTP 200 OK
    </div>

    <p>
      Tecnología: Nginx + Docker + Render
    </p>
  </main>
</body>
</html>
